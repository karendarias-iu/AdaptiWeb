<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptiWeb</title>
  <link rel="stylesheet" href="../src/css/main.css">
</head>
<body>

  <!-- Panel superior (encabezado) -->
  <header class="header">
    <div class="barraSuperior">
      <img src="assets/AdaptiWeb_logo.png" alt="Logo AdaptiWeb" id="logotipo">
      <span class="nombrePagina">AdaptiWeb</span>
    </div>
  </header>
  
  <!-- Panel principal -->
  <main class="panelPrincipal">
    <!-- Contenedore del panel (opciones y secciones (inicio sesion o registro)) -->
    <section id="contenedorPanel">
      <!-- panel opciones de incio de sesion o de registro-->
      <div id="panelOpciones">
        <!-- Eslogan -->
        <h1 class="eslogan">La web que se adapta a usted, no al revés</h1>
        <!-- Botones de inicio de sesión y registro -->
        <div class="botonesOpciones">
          <button id="botonInicioSesion" class="boton">Iniciar sesión</button>
          <button id="botonRegistro" class="boton">Registrarse</button>
        </div>
      </div>
      <div class="panelFormularios">
        <div id="panelError" class="panelError oculto">
          <img src="/assets/logoAlerta.png" alt="alerta" class="logoAlerta">
          <h4 id="mensajeError"></h4>
        </div>
        <!-- Formulario Login -->
        <form id="form-login" class="formulario oculto">
          <h2>Iniciar Sesión</h2>
          <input type="email" placeholder="Correo electrónico" required class="camposFormulario">
          <input type="password" placeholder="Contraseña" required class="camposFormulario">
          <button type="submit" class="boton">Ingresar</button>
        </form>

        <!-- Formulario Registro -->
        <form id="form-register" class="formulario oculto">
          <h2>Registro</h2>
          <input type="text" placeholder="Nombre" class="camposFormulario">
          <input type="email" placeholder="Correo electrónico" class="camposFormulario">
          <div class="campoPassword">
            <input type="password" placeholder="Contraseña" class="camposFormulario" id="password">
            <button type="button" id="ver-ocultarPassword" class="botonOjo">
                <svg id="iconoOjo" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
          </div>
          <button type="submit" class="boton">Crear cuenta</button>
        </form>
      </div>
    </section>

  </main>

  <script src="../src/js/mainInicio.js"></script>
</body>
</html>
