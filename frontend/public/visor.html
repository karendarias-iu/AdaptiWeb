<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Lectura - AdaptiWeb</title>
  <!-- tema.js aplica inmediatamente las preferencias guardadas o los valores predeterminados -->
  <script src="../src/js/tema.js"></script>
  <link rel="stylesheet" href="../src/css/textoAdaptado.css">
  <link rel="stylesheet" href="../src/css/visor.css">
</head>
<body>

  <!-- Botón de salir en la parte superior izquierda -->
  <a href="dashboard.html" id="btn-salir" class="btn-salir" aria-label="Salir y volver a la pantalla principal">
    ← Salir
  </a>

  <!-- Único cuadro centrado que cubre 2/3 del ancho y se extiende por todo el largo -->
  <main class="visor-wrapper">
    <article id="cuadro-lectura" class="cuadro-lectura texto-adaptado" aria-label="Área de lectura"></article>
  </main>

  <!-- Lector por voz: botón central izquierdo que despliega los controles de reproducción -->
  <aside id="lector" class="lector" aria-label="Lector por voz">
    <button type="button" id="lector-toggle" class="lector-btn lector-toggle" aria-expanded="false" aria-controls="lector-controles">Lector por voz</button>
    <div id="lector-controles" class="lector-controles">
      <button type="button" id="tts-reproducir" class="lector-btn" style="--i:0">Reproducir</button>
      <button type="button" id="tts-pausar" class="lector-btn" style="--i:1" disabled>Pausar</button>
      <button type="button" id="tts-detener" class="lector-btn" style="--i:2" disabled>Detener</button>
      <select id="tts-voz" aria-label="Seleccionar voz">
        <option value="femenina">Femenina</option>
        <option value="masculina">Masculina</option>
      </select>
      <p id="tts-estado" class="lector-estado" role="status" aria-live="polite"></p>
    </div>
  </aside>

  <script src="../src/js/visor.js"></script>
  <script src="../src/js/tts.js"></script>
</body>
</html>
