<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña - AdaptiWeb</title>
  <link rel="stylesheet" href="../src/css/main.css">
  <link rel="stylesheet" href="../src/css/resetPassword.css">
</head>
<body>

  <!-- Panel superior, contiene logo y nombre -->
  <header class="header">
    <div class="barraSuperior">
      <img src="assets/AdaptiWeb_logo.png" alt="Logo AdaptiWeb" id="logotipo">
      <span class="nombrePagina">AdaptiWeb</span>
    </div>
  </header>

  <!-- Panel prinicipal del dashboard -->
  <main class="panelPrincipal">
    <section id="contenedorPanel" class="fondoNegro">
      <div class="panelFormularios">
        <!-- Panel de alertas/errores/información -->
        <div id="panelError" class="panelError oculto">
          <img src="/assets/logoAlerta.png" alt="alerta" class="logoAlerta">
          <h4 id="mensajeError"></h4>
        </div>

        <!-- Formulario nueva contraseña -->
        <form id="form-new-password" class="formulario">
          <h2>Nueva contraseña</h2>
          <p>Ingresa y confirma tu nueva contraseña (mínimo 8 caracteres).</p>
          <div class="campoPassword">
            <input type="password" id="nuevaPassword" placeholder="Nueva contraseña" class="camposFormulario password" required>
            <button type="button" class="botonOjo" aria-label="Mostrar u ocultar contraseña">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <div class="campoPassword">
            <input type="password" id="confirmarPassword" placeholder="Confirmar contraseña" class="camposFormulario password" required>
            <button type="button" class="botonOjo" aria-label="Mostrar u ocultar contraseña">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <button type="submit" id="botonGuardarPassword" class="boton">Guardar contraseña</button>
        </form>

        <!-- Vista de confirmación exitosa -->
        <div id="panelMensaje" class="formulario oculto">
          <h2>¡Contraseña actualizada!</h2>
          <p>Tu contraseña ha sido restablecida correctamente. Ya puedes iniciar sesión con tu nueva clave.</p>
          <button type="button" id="botonVolverInicio" class="boton">Ir a iniciar sesión</button>
        </div>
        </div>

      </div>
    </section>
  </main>

  <script src="../src/js/resetPassword.js"></script>
</body>
</html>
