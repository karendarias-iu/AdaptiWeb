<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptiWeb</title>
  <!-- tema.js va en el head y sin defer: aplica el contraste guardado antes de pintar la página -->
  <script src="../src/js/tema.js"></script>
  <link rel="stylesheet" href="../src/css/textoAdaptado.css">
  <link rel="stylesheet" href="../src/css/dashboard.css">
</head>
<body>

   <!-- Panel superior (encabezado) -->
  <header class="header">
    <div class="barraSuperior">
      <a href="Inicio.html" aria-label="Ir a la pantalla de inicio de sesión"><img src="assets/AdaptiWeb_logo.png" alt="AdaptiWeb Logo" class="logotipo"></a>
      <span class="textoLogo">AdaptiWeb</span>
    </div>
    <!-- boton de menu desplegable-->
    <button id="botonMenu" class="icon-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">☰</button>
  </header>

  <!-- Menu desplegable (listado de las opciones) -->
  <aside id="sidebar" class="sidebar">
    <div id="vista-menu" class="sidebar-vista">
      <nav class="sidebar-nav">
        <a href="tareas.html" id="nav-tasks" class="opcionMenu" style="--i:0">Lista de tareas</a>
        <a href="temporizador.html" id="nav-timer" class="opcionMenu" style="--i:1">Temporizador</a>
        <a href="marcadores.html" id="nav-bookmarks" class="opcionMenu" style="--i:2">Marcador</a>
        <a href="preferencias.html" id="nav-prefs" class="opcionMenu" style="--i:3">Preferencias</a>
        <a href="#" id="nav-logout" class="opcionMenu" style="--i:4">Cerrar sesión</a>
      </nav>
      <button type="button" id="nav-delete-account" class="opcionMenu opcionPeligro" style="--i:5">Eliminar cuenta</button>
    </div>
  </aside>
   <!-- Ventana emergente: confirmar eliminación de la cuenta -->
  <div id="modal-eliminar-cuenta" class="cuenta-overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="eliminar-titulo" aria-describedby="eliminar-texto">
    <div class="cuenta-card">
      <h2 id="eliminar-titulo" class="cuenta-titulo">¿Está seguro?</h2>
      <p id="eliminar-texto" class="cuenta-texto">Se borrarán sus preferencias de usuario, las tareas y los marcadores que ya tenía para siempre, eso es... Mucho tiempo.</p>
      <p id="eliminar-error" class="cuenta-error hidden" role="alert"></p>
      <div class="cuenta-acciones">
        <button type="button" id="btn-cancelar-eliminar" class="btn-regresar">Regresar</button>
        <button type="button" id="btn-confirmar-eliminar" class="btn-eliminar-cuenta">Eliminar</button>
      </div>
    </div>
  </div>
  <main class="main-container">

    <!-- Dashboard -->
    <section id="view-dashboard" class="view-section">
      <h1 class="dashboard-title">¿Qué harás hoy?</h1>
      
      <div class="panels-grid">
        <!-- Panel 1: URL Proxy Extractor -->
        <div class="card-panel">
          <label>Ingresar URL de sitio o PDF</label>
          <div class="search-box">
            <input type="url" placeholder="Ingresar URL..." class="input-search">
            <button class="send-btn" aria-label="Enviar URL">➤</button>
          </div>
        </div>

        <!-- Panel 2: Inserción de texto manual -->
        <div class="card-panel">
          <label>Ingresar o pegar texto directo</label>
          <textarea placeholder="Ingresar o pegar texto..." class="text-area-input"></textarea>
          <button class="btn btn-light full-width">Abrir visor</button>
          <button class="btn" id="limpiarTexto">Limpiar texto</button>
        </div>
      </div>
    </section>

  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="../src/js/dashboard.js"></script>
</body>
</html>
