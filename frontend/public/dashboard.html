<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptiWeb</title>
  <!-- tema.js va en el head y sin defer: aplica el contraste guardado antes de pintar la página -->
  <script src="../src/js/tema.js"></script>
  <link rel="stylesheet" href="../src/css/textoAdaptado.css">
  <link rel="stylesheet" href="../src/css/dashboard.css">
</head>
<body>

  <!-- Encabezado, contiene logo y nombre -->
  <header class="header">
    <div class="barraSuperior">
      <img src="assets/AdaptiWeb_logo.png" alt="AdaptiWeb Logo" class="logotipo">
      <span class="textoLogo">AdaptiWeb</span>
    </div>
    <button id="menu-btn" class="icon-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">☰</button>
  </header>

  <!-- Panel lateral desplegable: contenedor de las herramientas (se navega entre ellas sin recargar la página).
       Cada opción tiene --i (su posición): el CSS lo usa para que aparezcan una a una. -->
  <aside id="sidebar" class="sidebar" aria-label="Panel de herramientas" inert>

    <!-- Vista principal: el menú -->
    <nav id="vista-menu" class="sidebar-vista" aria-label="Herramientas">
      <button type="button" class="opcionMenu" style="--i:0" data-vista="tareas">Lista de tareas</button>
      <button type="button" class="opcionMenu" style="--i:1" data-vista="temporizador">Temporizador</button>
      <button type="button" class="opcionMenu" style="--i:2" data-vista="marcadores">Marcadores</button>
      <button type="button" class="opcionMenu" style="--i:3" data-vista="configuracion">Configuración</button>
      <a href="preferencias.html" id="nav-prefs" class="opcionMenu" style="--i:4">Preferencias</a>
      <button type="button" id="nav-logout" class="opcionMenu" style="--i:5">Cerrar sesión</button>
    </nav>

    <!-- Vistas de cada herramienta. Cada una tiene un contenedor (#contenido-...) donde se monta su funcionalidad. -->
    <section id="vista-tareas" class="sidebar-vista" aria-labelledby="titulo-tareas" hidden>
      <div class="vista-cabecera">
        <button type="button" class="btn-volver" data-volver aria-label="Volver al menú">←</button>
        <h2 id="titulo-tareas" class="vista-titulo">Lista de tareas</h2>
      </div>
      <div id="contenido-tareas" class="vista-contenido">
        <p class="vista-vacia">Aquí irá tu lista de tareas.</p>
      </div>
    </section>

    <section id="vista-temporizador" class="sidebar-vista" aria-labelledby="titulo-temporizador" hidden>
      <div class="vista-cabecera">
        <button type="button" class="btn-volver" data-volver aria-label="Volver al menú">←</button>
        <h2 id="titulo-temporizador" class="vista-titulo">Temporizador</h2>
      </div>
      <div id="contenido-temporizador" class="vista-contenido">
        <p class="vista-vacia">Aquí irá el temporizador.</p>
      </div>
    </section>

    <section id="vista-marcadores" class="sidebar-vista" aria-labelledby="titulo-marcadores" hidden>
      <div class="vista-cabecera">
        <button type="button" class="btn-volver" data-volver aria-label="Volver al menú">←</button>
        <h2 id="titulo-marcadores" class="vista-titulo">Marcadores</h2>
      </div>
      <div id="contenido-marcadores" class="vista-contenido">
        <p class="vista-vacia">Aquí irán tus marcadores.</p>
      </div>
    </section>

    <section id="vista-configuracion" class="sidebar-vista" aria-labelledby="titulo-configuracion" hidden>
      <div class="vista-cabecera">
        <button type="button" class="btn-volver" data-volver aria-label="Volver al menú">←</button>
        <h2 id="titulo-configuracion" class="vista-titulo">Configuración</h2>
      </div>
      <div id="contenido-configuracion" class="vista-contenido">
        <p class="vista-vacia">Aquí irá la configuración.</p>
      </div>
    </section>

  </aside>

  <main class="main-container">

    <!-- VISTA 2: DASHBOARD PRINCIPAL ("¿Qué harás hoy?") -->
    <section id="view-dashboard" class="view-section">
      <h1 class="dashboard-title">¿Qué harás hoy?</h1>
      
      <div class="panels-grid">
        <!-- Panel 1: URL Proxy Extractor -->
        <div class="card-panel">
          <label>Ingresar URL de sitio o PDF</label>
          <div class="search-box">
            <input type="url" placeholder="Ingresar URL..." class="input-search">
            <button class="send-btn" aria-label="Enviar URL">➤</button>
          </div>
        </div>

        <!-- Panel 2: Inserción de texto manual -->
        <div class="card-panel">
          <label>Ingresar o pegar texto directo</label>
          <textarea placeholder="Ingresar o pegar texto..." class="text-area-input"></textarea>
          <button class="btn btn-light full-width">Abrir visor</button>
        </div>
      </div>
    </section>

  </main>

  <script src="../src/js/dashboard.js"></script>
</body>
</html>
